name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" }
          else { $v = "0.0.0-dev+" + "${{ github.sha }}".Substring(0, 7) }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Version "${{ steps.version.outputs.version }}" -OutDir dist

      - name: Check the exe
        shell: pwsh
        run: |
          $info = (Get-Item dist/NubMouse.exe).VersionInfo
          "FileVersion:    $($info.FileVersion)"
          "ProductVersion: $($info.ProductVersion)"

      - name: Build MSIX packages (x64 + arm64)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          if ($ver -match '^0\.0\.0') { $ver = "0.0.1" }
          $args = @{ Version = $ver; Arch = "all"; ExePath = "dist/NubMouse.exe"; OutDir = "dist" }
          if ($env:MSIX_IDENTITY_NAME) { $args.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $args.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $args.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          ./packaging/msix/build-msix.ps1 @args

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NubMouse-${{ steps.version.outputs.version }}
          path: |
            dist/NubMouse.exe
            dist/*.msix
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write       # signs the build attestation (Sigstore)
      attestations: write   # stores it on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: NubMouse-${{ github.ref_name }}
          path: dist

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = "stage/NubMouse-$tag"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist/NubMouse.exe, README.md, CHANGELOG.md, LICENSE $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/NubMouse-$tag.zip"
          Push-Location dist
          Get-ChildItem NubMouse.exe, "NubMouse-$tag.zip" | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      # Lets anyone check a download came from this workflow and commit:
      #   gh attestation verify NubMouse.exe -R dstarikov/NubMouse
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/NubMouse.exe
            dist/NubMouse-${{ github.ref_name }}.zip

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $flags = @("--generate-notes", "--title", "NubMouse $tag")
          if ($tag -match "-") { $flags += "--prerelease" }
          gh release create $tag @flags `
            dist/NubMouse.exe "dist/NubMouse-$tag.zip" dist/SHA256SUMS.txt
